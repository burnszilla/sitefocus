[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "sitefocus"
version = "1.2.0"
description = "Site focus and internal linking: Link Focus Score, page map, and a simulated internal linking plan."
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["numpy>=1.22"]

authors = [{name = "Stephen Burns"}]

[project.urls]
Homepage = "https://github.com/burnszilla/sitefocus"
Author = "https://stephenburns.ai"

[project.scripts]
sitefocus = "sitefocus.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
sitefocus = ["assets/*.css"]
